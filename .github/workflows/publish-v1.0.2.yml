name: Publish first APK release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.0.2.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-v1.0.2
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v1.0.2
      SOURCE_SHA: 80071e330b2c763f7f57c4a5232aca5591a832c4
      RUN_ID: '45921228775'
    steps:
      - name: Check source build and download APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .conclusion)" = success
          gh run download "$RUN_ID" --repo "$GH_REPO" --name DecibelMeter-debug --dir dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/DecibelMeter-v1.0.2-debug.apk
          unzip -t dist/DecibelMeter-v1.0.2-debug.apk
          (cd dist && sha256sum DecibelMeter-v1.0.2-debug.apk > SHA256SUMS.txt)
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; no overwrite."
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          ## 分贝检测仪 V1.0.2 · 首个公开测试版

          - 实时分贝检测、六级噪音分类、最低/最高/等效声级及趋势曲线。
          - 自定义阈值、环境噪音参考、分贝校准、暂停和重新检测。
          - 深浅色主题、屏幕常亮、适配圆形及圆角桌面图标。
          - 完全离线，无广告，无网络权限，不保存或上传录音。
          - 提供中文项目文档、构建脚本、隐私政策和 CI 配置。

          ### 安装
          下载 DecibelMeter-v1.0.2-debug.apk，Android 8.0 及以上设备允许对应来源安装后打开，授权麦克风。
          如与旧版签名冲突，先卸载旧版（将清除设置）再安装。

          ### 验证与限制
          APK 来自成功的 GitHub Actions 构建 45921228775，使用调试签名，尚未经过真机验收，不作为应用商店正式发行包。
          未经专业校准的读数仅供参考，不能替代专业声级计。
          SHA256SUMS.txt 可用于校验下载文件完整性。
          EOF
          gh release create "$TAG" dist/DecibelMeter-v1.0.2-debug.apk dist/SHA256SUMS.txt --repo "$GH_REPO" --target "$SOURCE_SHA" --title "分贝检测仪 V1.0.2 · 首个公开测试版" --notes-file release-notes.md --prerelease
